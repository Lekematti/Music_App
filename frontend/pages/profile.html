<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Music App - Profile</title>
	<link rel="stylesheet" href="../css/style.css">
	        <script type="module" src="/js/main.js"></script>
</head>
<body>
	<top-bar-component></top-bar-component>

	<main class="profile-container">
        <aside class="profile-sidebar" aria-label="Profile navigation sidebar">
			<ul id="profile-nav">
				<li class="active" data-target="publications-section">
					<img src="../assets/icons/profile.png" alt="My Publications" class="sidebar-icon">
					Publications
				</li>
				<li data-target="password-section">
					<img src="../assets/icons/settings.png" alt="Change password" class="sidebar-icon lock-icon">
					Change password
				</li>
				<li data-target="username-section">
					<img src="../assets/icons/settings.png" alt="Change username" class="sidebar-icon">
					Change username
				</li>
				<li data-target="email-section">
					<img src="../assets/icons/settings.png" alt="Change email" class="sidebar-icon email-icon">
					Change email
				</li>
			</ul>
			
			<div style="padding: 20px; margin-top: 20px; border-top: 1px solid #2a2a2a;">
				<button id="logout-btn" style="width: 100%; padding: 10px; background-color: #16171b; border: 1px solid #d9534f; color: #d9534f; border-radius: 4px; cursor: pointer; transition: 0.2s;">
					Logout
				</button>
				<br>
				<button id="delete-account-btn" style="width: 100%; margin-top: 12px; padding: 10px; background-color: #16171b; border: 1px solid #b30000; color: #ff6b6b; border-radius: 4px; cursor: pointer; transition: 0.2s;">
					Delete Account
				</button>
			</div>
		</aside>

		<section class="profile-content">
            <div id="publications-section" class="profile-tab" style="display: block;">
			    
			    <h2>Publications</h2>
			    <div class="publication-list">
    </div>
            </div>

            <!-- Change Password Section -->
            <div id="password-section" class="profile-tab" style="display: none;">
                <h2>Change Password</h2>
                <form class="auth-form" style="max-width: 400px; margin-top: 20px;">
                    <div class="form-group">
                        <label for="current-password">Current Password</label>
						<password-input input-id="current-password" placeholder="Enter current password" required hide-icon></password-input>
                    </div>
                    <div class="form-group" style="margin-top: 15px;">
                        <label for="new-password">New Password</label>
						<password-input input-id="new-password" placeholder="Enter new password" required hide-icon></password-input>
                    </div>
                    <button type="submit" class="primary-btn" style="margin-top: 20px;">Update Password</button>
                </form>
            </div>

            <!-- Change Username Section -->
            <div id="username-section" class="profile-tab" style="display: none;">
                <h2>Change Username</h2>
                <form class="auth-form" style="max-width: 400px; margin-top: 20px;">
                    <div class="form-group">
                        <label for="new-username">New Username</label>
                        <input type="text" id="new-username" placeholder="Enter new username" required style="width: 100%; padding: 10px; background: #16171b; border: 1px solid #2a2a2a; color: white;">
                    </div>
                    <button type="submit" class="primary-btn" style="margin-top: 20px;">Update Username</button>
                </form>
            </div>

            <!-- Change Email Section -->
            <div id="email-section" class="profile-tab" style="display: none;">
                <h2>Change Email</h2>
                <form class="auth-form" style="max-width: 400px; margin-top: 20px;">
                    <div class="form-group">
                        <label for="new-email">New Email Address</label>
                        <input type="email" id="new-email" placeholder="Enter new email" required style="width: 100%; padding: 10px; background: #16171b; border: 1px solid #2a2a2a; color: white;">
                    </div>
                    <button type="submit" class="primary-btn" style="margin-top: 20px;">Update Email</button>
                </form>
            </div>
		</section>

        <aside class="profile-info-sidebar" aria-label="Profile information sidebar">
			<div class="user-profile-card">
				<div class="user-avatar-wrapper">
					<div class="user-avatar">
						<img id="user-avatar-img" src="" alt="User Avatar" style="width: 100%; height: 100%; object-fit: cover;">
					</div>
					<button type="button" id="change-avatar-btn" class="avatar-edit-btn" aria-label="Change profile picture" title="Change profile picture">
						<img src="../assets/icons/upload.png" alt="">
					</button>
					<input id="avatar-file-input" name="avatarFile" class="avatar-upload-input" type="file" accept="image/jpeg,image/png,image/webp">
				</div>
				<div class="user-info">
					<h3 id="user-name">Loading...</h3>
					<p id="user-email" class="user-email">Loading...</p>
					<div class="user-stats">
						<div class="stat">
							<span class="stat-value" id="publication-count">0</span>
							<span class="stat-label">Publications</span>
						</div>
						<div class="stat">
							<span class="stat-value" id="total-likes">0</span>
							<span class="stat-label">Rating Average</span>
						</div>
					</div>
				</div>
			</div>
		</aside>
	</main>

	<script src="../js/profile.js"></script>
		                    </body>
</html>
