<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Song - Music App</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <top-bar-component></top-bar-component>

    <main class="auth-content">
        <div class="auth-card">
            <h2>Upload a Song</h2>
            <p style="text-align: center; color: #aaa; margin-bottom: 20px;">Add a new track.</p>

            <form id="upload-form" class="auth-form">
                <div class="form-group">
                    <label for="title">Song Title</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🎵</span>
                        <input type="text" id="title" required placeholder="Example: My New Song">
                    </div>
                </div>

                <div class="form-group">
                    <label for="artist">Artist</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="artist" required placeholder="Example: The Band">
                    </div>
                </div>

                <div class="form-group">
                    <label for="url">Audio File URL (temporary)</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔗</span>
                        <input type="url" id="url" required placeholder="https://example.com/song.mp3">
                    </div>
                </div>

                <div class="form-group">
                    <label for="imageUrl">Cover Image URL (optional)</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🖼️</span>
                        <input type="url" id="imageUrl" placeholder="https://example.com/cover.jpg">
                    </div>
                </div>

                <button type="submit" class="primary-btn">Upload</button>
            </form>
            <p id="upload-message" style="margin-top: 15px; text-align: center;"></p>
        </div>
    </main>

    <!-- Component scripts -->
    <script src="../js/components/top-bar.js"></script>
    <script src="../js/components/menu.js"></script>

    <!-- Upload logic -->
    <script src="../js/upload.js"></script>
</body>
</html>
