<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/menu.js"></script>
</head>
<body>
    <header class="top-bar">
        <div class="logo">
            <a href="../index.html"><img src="../assets/icons/logo.png" alt="Logo"></a>
        </div>
        <div class="user-nav">
            <button id="menu-btn" class="menu-btn"><img src="../assets/icons/list.png" alt="Menu"></button>
        </div>
    </header>

    <main class="content">
<button onclick="window.history.back();" class="back-link" style="background: none; border: none; padding: 0; cursor: pointer; color: inherit; font: inherit; text-decoration: underline; display: inline-block; margin-bottom: 20px;">← Back</button>
        
        <section class="auth-card" style="margin: 30px auto; max-width: 600px; text-align: center; background-color: #16171b; padding: 40px; border-radius: 8px; border: 1px solid #2a2a2a;">
            <div style="font-size: 80px; margin-bottom: 20px; filter: grayscale(1);">🎵</div>
            <h1 id="song-title" style="margin-bottom: 10px; font-size: 28px;">Loading...</h1>
            <h3 id="song-artist" style="color: #888; font-weight: normal; margin-bottom: 40px; font-size: 18px;">Loading...</h3>
            
            <div class="player-mock" style="padding: 30px; background: #0d0e12; border: 1px solid #2a2a2a; border-radius: 8px; margin: 20px 0; text-align: center;">
                <p style="color: #666; margin-bottom: 20px; font-size: 14px;">[ MOCK AUDIO PLAYER ]</p>

                <!-- Mock progress bar -->
                <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 25px;">
                    <span style="color: #888; font-size: 12px;">0:00</span>
                    <div style="flex-grow: 1; height: 6px; background: #2a2a2a; border-radius: 3px; position: relative;">
                        <div style="position: absolute; left: 0; top: 0; height: 100%; width: 25%; background: white; border-radius: 3px;"></div>
                    </div>
                    <span style="color: #888; font-size: 12px;">3:45</span>
                </div>

                <!-- Play controls -->
                <div style="display: flex; justify-content: center; align-items: center; gap: 20px;">
                    <button style="background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer;">⏮</button>
                    <button id="mock-play-btn" style="background: white; color: black; border: none; border-radius: 50%; width: 60px; height: 60px; font-size: 24px; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">▶</button>
                    <button style="background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer;">⏭</button>
                </div>
            </div>
        </section>
    </main>

    <script src="../js/song.js"></script>
</body>
</html>
