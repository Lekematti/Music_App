<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music App - Forgot Password</title>
    <link rel="stylesheet" href="../css/style.css">
    <script type="module" src="/js/main.js"></script>
</head>
<body>
    <header class="top-bar" style="justify-content: center;">
        <div class="logo">
            <img src="../assets/icons/logo.png" alt="Logo" style="height: 80px;">
        </div>
    </header>

    <main class="content auth-content">
        <div class="auth-card">
            <h2>Forgot Password</h2>
            <p style="color: #888; margin-bottom: 20px; font-size: 14px;">
                Enter your email address and we'll send you a link to reset your password.
            </p>
            <form class="auth-form" id="forgot-password-form">
                <div class="auth-message" id="forgot-password-message" aria-live="polite"></div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="email" placeholder="Email" required>
                    </div>
                </div>
                <button type="submit" class="primary-btn">Send Reset Link</button>
            </form>
            <div class="auth-footer">
                <p>Remembered your password? <a href="login.html">Login</a></p>
            </div>
        </div>
    </main>

    <script type="module" src="../js/forgot-password.js"></script>
</body>
</html>
