<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Music App - Home</title>
	<link rel="stylesheet" href="./css/style.css">
	<script type="module" src="/js/main.js"></script>
</head>
<body>
	<top-bar-component></top-bar-component>

	<main class="content">
		<!-- Top 10 -->
		<section class="music-category">
			<div class="section-header">
				<h2>Top 10</h2>
				<a href="./pages/top10.html" class="view-all">View all</a>
			</div>
			<div class="horizontal-list" id="top10-widget"></div>
		</section>

		<!-- Past Uploads -->
		<section class="music-section">
			<div class="section-header">
				<h2>Past Uploads</h2>
				<a href="./pages/past-uploads.html" class="view-all">View all</a>
			</div>
			<div class="horizontal-list" id="past-uploads-widget"></div>
		</section>

		<!-- New Uploads -->
		<section class="music-section">
			<div class="section-header">
				<h2>New Uploads</h2>
				<a href="./pages/new-uploads.html" class="view-all">View all</a>
			</div>
			<div class="horizontal-list" id="new-uploads-list">
				 <!-- Songs will be dynamically inserted here -->
			</div>
		</section>
	</main>

		<!-- Global Fixed Bottom Player -->
		<audio-player-component id="global-player" style="position: fixed; bottom: 12px; left: 12px; right: 12px; z-index: 1000; display: block; max-width: 1200px; margin: 0 auto;">
		</audio-player-component>

    <script src="./js/home.js"></script>
</body>
</html>
