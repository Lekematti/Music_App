<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song</title>
    <link rel="stylesheet" href="../css/style.css">
    
    
    <script type="module" src="/js/main.js"></script>
</head>
<body>
    <top-bar-component></top-bar-component>

    <main class="content">
<back-button></back-button>
        
        <section class="auth-card" style="margin: 30px auto; max-width: 600px; text-align: center; background-color: #16171b; padding: 40px; border-radius: 8px; border: 1px solid #2a2a2a;">
            <div style="font-size: 80px; margin-bottom: 20px; filter: grayscale(1);">🎵</div>
            <h1 id="song-title" style="margin-bottom: 10px; font-size: 28px;">Loading...</h1>
            <h3 id="song-artist" style="color: #888; font-weight: normal; margin-bottom: 40px; font-size: 18px;">Loading...</h3>
        </section>
    </main>

    <audio-player-component id="global-player" style="position: fixed; bottom: 12px; left: 12px; right: 12px; z-index: 1000; display: block; max-width: 1200px; margin: 0 auto;">
    </audio-player-component>

    <script src="../js/song.js"></script>
