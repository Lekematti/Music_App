<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music App - Reset Password</title>
    <link rel="stylesheet" href="../css/style.css">
    <script type="module" src="/js/main.js"></script>
</head>
<body>
    <header class="top-bar" style="justify-content: center;">
        <div class="logo">
            <img src="../assets/icons/logo.png" alt="Logo" style="height: 80px;">
        </div>
    </header>

    <main class="content auth-content">
        <div class="auth-card">
            <h2>Reset Password</h2>
            <form class="auth-form" id="reset-password-form">
                <div class="auth-message" id="reset-password-message" aria-live="polite"></div>
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <password-input input-id="new-password" placeholder="Enter new password" required></password-input>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label for="confirm-password">Confirm Password</label>
                    <password-input input-id="confirm-password" placeholder="Confirm new password" required></password-input>
                </div>
                <button type="submit" class="primary-btn" style="margin-top: 20px;">Reset Password</button>
            </form>
            <div class="auth-footer">
                <p>Remembered your password? <a href="login.html">Login</a></p>
            </div>
        </div>
    </main>

    <script type="module" src="../js/reset-password.js"></script>
</body>
</html>
