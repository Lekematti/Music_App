<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Music App - Login</title>
	<link rel="stylesheet" href="../css/style.css">
    <script src="../js/menu.js"></script>
</head>
<body>
	<header class="top-bar" style="justify-content: center;">
		<div class="logo">
			<img src="../assets/icons/logo.png" alt="Logo" style="height: 80px;"></a>
		</div>
	    <div class="user-nav" style="position: absolute; right: 30px;">
            <button id="menu-btn" class="menu-btn"><img src="../assets/icons/list.png" alt="Menu"></button>
        </div>
</header>

	<main class="content auth-content">
		<div class="auth-card">
			<h2>Login</h2>
			<form class="auth-form" id="login-form">
				<div class="form-group">
					<label for="email">Email</label>
					<div class="input-wrapper">
						<span class="input-icon">✉️</span>
						<input type="email" id="email" placeholder="Email" required>
					</div>
				</div>
				<div class="form-group">
					<label for="password">Password</label>
					<div class="input-wrapper">
						<span class="input-icon">🔒</span>
						<input type="password" id="password" placeholder="Password" required>
					</div>
				</div>
				<div class="forgot-password">
					<a href="#">Forgot password?</a>
				</div>
				<button type="submit" class="primary-btn">Login</button>
			</form>
			<div class="auth-footer">
				<p>Don't have an account? <a href="register.html">Register</a></p>
			</div>
		</div>
	</main>

	<script src="../js/login.js"></script>
    <script src="../js/top-bar.js"></script>
    <script src="../js/star-rating.js"></script>
    <script src="../js/list-row-item.js"></script>
    <script src="../js/publication-item.js"></script>
    <script src="../js/back-button.js"></script>
</body>
</html>
