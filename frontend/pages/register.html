<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Music App - Register</title>
	<link rel="stylesheet" href="../css/style.css">
    <script src="../js/components/menu.js"></script>
</head>
<body>
	<header class="top-bar" style="justify-content: center;">
		<div class="logo">
			<img src="../assets/icons/logo.png" alt="Logo" style="height: 80px;"></a>
		</div>
	    <div class="user-nav" style="position: absolute; right: 30px;">
            <button id="menu-btn" class="menu-btn"><img src="../assets/icons/list.png" alt="Menu"></button>
        </div>
</header>

	<main class="content auth-content">
		<div class="auth-card">
			<h2>Create new account</h2>
			<form class="auth-form" id="register-form">
				<div class="auth-message" id="register-message" aria-live="polite"></div>
				<div class="form-group">
					<label for="username">Username</label>
					<div class="input-wrapper">
						<span class="input-icon">👤</span>
						<input type="text" id="username" placeholder="Username" minlength="3" maxlength="30" required>
					</div>
				</div>
				<div class="form-group">
					<label for="email">Email</label>
					<div class="input-wrapper">
						<span class="input-icon">✉️</span>
						<input type="email" id="email" placeholder="Email" required>
					</div>
				</div>
				<div class="form-group">
					<label for="password">Password</label>
					<password-input input-id="password" placeholder="Password" minlength="6" required></password-input>
				</div>
				<button type="submit" class="primary-btn">Register</button>
			</form>
			<div class="auth-footer">
				<p>Already have an account? <a href="login.html">Login</a></p>
			</div>
		</div>
	</main>
	<script src="../js/register.js"></script>
	<script src="../js/router.js"></script>
	<script src="../js/components/password-input.js"></script>
    <script src="../js/components/top-bar.js"></script>
    <script src="../js/components/star-rating.js"></script>
    <script src="../js/components/list-row-item.js"></script>
    <script src="../js/components/publication-item.js"></script>
    <script src="../js/components/back-button.js"></script>
</body>
</html>
