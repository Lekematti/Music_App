<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Music App - Past Uploads</title>
	<link rel="stylesheet" href="../css/style.css">
    <script src="../js/menu.js"></script>
</head>
<body>
	<header class="top-bar">
		<div class="logo">
			<a href="../index.html"><img src="../assets/icons/logo.png" alt="Logo"></a>
		</div>
		<div class="search-bar">
			<input type="text" placeholder="Search songs, artists, albums...">
			<button class="search-icon"><img src="../assets/icons/search.png" alt="Search"></button>
		</div>
		<div class="user-nav">
            <button id="menu-btn" class="menu-btn"><img src="../assets/icons/list.png" alt="Menu"></button>
        </div>
	</header>

	<main class="content">
		<a href="../index.html" class="back-link">← Back to Home</a>
		
		<section class="music-list-page">
			<div class="section-header">
				<h2>Past Uploads</h2>
			</div>
			
			<div class="vertical-list">
				<div class="list-row" onclick="window.location.href='song.html?id=1'" style="cursor: pointer;" role="button" tabindex="0" onkeydown="if(event.key==='Enter') this.click();">
					<span class="row-number">1.</span>
					<div class="item-icon">🎵</div>
					<div class="item-info">
						<h4>Song Name</h4>
						<p>Artist</p>
					</div>
					<div class="stars">
						<img src="../assets/icons/star.png" alt="Star"><img src="../assets/icons/star.png" alt="Star"><img src="../assets/icons/star.png" alt="Star"><img src="../assets/icons/star.png" alt="Star"><img src="../assets/icons/star.png" alt="Star">
					</div>
				</div>
				<div class="list-row" onclick="window.location.href='song.html?id=1'" style="cursor: pointer;" role="button" tabindex="0" onkeydown="if(event.key==='Enter') this.click();">
					<span class="row-number">2.</span>
					<div class="item-icon">🎵</div>
					<div class="item-info">
						<h4>Song Name</h4>
						<p>Artist</p>
					</div>
					<div class="stars">
						<img src="../assets/icons/star.png" alt="Star"><img src="../assets/icons/star.png" alt="Star"><img src="../assets/icons/star.png" alt="Star"><img src="../assets/icons/star.png" alt="Star"><img src="../assets/icons/star.png" alt="Star">
					</div>
				</div>
			</div>
		</section>
	</main>

	<script src="../js/script.js" type="module"></script>
</body>
</html>
